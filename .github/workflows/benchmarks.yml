name: Performance Benchmarks

on:
  push:
    branches:
      - main
    paths:
      - "src/UnitConverter/**"
      - "benchmarks/**"
      - "scripts/summarize_benchmarks.py"
      - ".github/workflows/benchmarks.yml"
  pull_request:
    paths:
      - "src/UnitConverter/**"
      - "benchmarks/**"
      - "scripts/summarize_benchmarks.py"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore benchmark project
        run: dotnet restore benchmarks/UnitConverter.Benchmarks/UnitConverter.Benchmarks.csproj

      - name: Run BenchmarkDotNet
        run: dotnet run --project benchmarks/UnitConverter.Benchmarks/UnitConverter.Benchmarks.csproj --configuration Release --no-restore -- --filter "*"

      - name: Summarize benchmark results and render badges
        run: |
          python scripts/summarize_benchmarks.py \
            BenchmarkDotNet.Artifacts/results \
            artifacts/benchmarks \
            --badges docs/benchmarks/badges \
            --latest-json docs/benchmarks/latest.json
          cat artifacts/benchmarks/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest benchmark badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/benchmarks/badges docs/benchmarks/latest.json; then
            echo "Benchmark badges are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/badges docs/benchmarks/latest.json
          git commit -m "Update benchmark badges [skip ci]"
          git push

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: unitconverter-benchmarks
          path: |
            BenchmarkDotNet.Artifacts/results/*
            artifacts/benchmarks/*
            docs/benchmarks/latest.json
            docs/benchmarks/badges/*.svg
          if-no-files-found: error
          retention-days: 30
