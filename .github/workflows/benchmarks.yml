name: Performance Benchmarks

on:
  push:
    branches:
      - main
    paths:
      - "src/UnitTools/**"
      - "benchmarks/**"
      - "scripts/summarize_benchmarks.py"
      - "scripts/compare_benchmarks.py"
      - ".github/workflows/benchmarks.yml"
  pull_request:
    paths:
      - "src/UnitTools/**"
      - "benchmarks/**"
      - "scripts/summarize_benchmarks.py"
      - "scripts/compare_benchmarks.py"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore benchmark project
        run: dotnet restore benchmarks/UnitTools.Benchmarks/UnitTools.Benchmarks.csproj

      - name: Capture reference benchmark baseline
        run: |
          mkdir -p artifacts/benchmarks
          cp docs/benchmarks/latest.json artifacts/benchmarks/reference.json

      - name: Run BenchmarkDotNet
        run: dotnet run --project benchmarks/UnitTools.Benchmarks/UnitTools.Benchmarks.csproj --configuration Release --no-restore -- --filter "*"

      - name: Summarize benchmark results and render badges
        run: |
          python scripts/summarize_benchmarks.py \
            BenchmarkDotNet.Artifacts/results \
            artifacts/benchmarks \
            --badges docs/benchmarks/badges \
            --latest-json docs/benchmarks/latest.json
          cat artifacts/benchmarks/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Compare against latest successful main baseline
        shell: bash
        run: |
          set +e
          python scripts/compare_benchmarks.py \
            artifacts/benchmarks/reference.json \
            docs/benchmarks/latest.json \
            artifacts/benchmarks \
            --timing-warning-percent 15 \
            --fail-on-allocation-regression \
            --fail-on-missing
          status=$?
          cat artifacts/benchmarks/comparison.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unittools-benchmarks
          path: |
            BenchmarkDotNet.Artifacts/results/*
            artifacts/benchmarks/*
            docs/benchmarks/latest.json
            docs/benchmarks/badges/*.svg
          if-no-files-found: error
          retention-days: 30

      - name: Upload badge assets
        uses: actions/upload-artifact@v7
        with:
          name: unittools-benchmark-badges
          path: |
            docs/benchmarks/latest.json
            docs/benchmarks/badges/*.svg
          if-no-files-found: error
          retention-days: 7

  publish-badges:
    name: Publish benchmark badges
    needs: benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download generated badge assets
        uses: actions/download-artifact@v7
        with:
          name: unittools-benchmark-badges
          path: artifacts/benchmark-badges

      - name: Update checked-in badge assets
        run: |
          mkdir -p docs/benchmarks/badges
          cp artifacts/benchmark-badges/latest.json docs/benchmarks/latest.json
          cp artifacts/benchmark-badges/badges/*.svg docs/benchmarks/badges/

          if git diff --quiet -- docs/benchmarks/badges docs/benchmarks/latest.json; then
            echo "Benchmark badges are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/badges docs/benchmarks/latest.json
          git commit -m "Update benchmark badges [skip ci]"
          git push
