name: Regenerate localization outputs

on:
  push:
    branches:
      - release/hardening-roadmap-preview2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/hardening-roadmap-preview2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python scripts/generate_localization.py
      - shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/UnitConverter/Common/UnitConverterLocalization.Generated.cs docs/LocalizationCoverage.md)" ]; then
            echo "Localization outputs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UnitConverter/Common/UnitConverterLocalization.Generated.cs docs/LocalizationCoverage.md
          git commit -m "Regenerate localization outputs"
          git push origin HEAD:release/hardening-roadmap-preview2
