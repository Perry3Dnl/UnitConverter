name: Regenerate typed parsers

on:
  push:
    branches:
      - feature/structural-localization-consistency
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/structural-localization-consistency
      - name: Regenerate named quantity sources
        run: python scripts/generate_legacy_named_quantities.py
      - name: Commit generated sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated sources are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UnitConverter/Quantities/GeneratedLegacy src/UnitConverter/Quantities/QuantityParsing.cs src/UnitConverter/Quantities/QuantityFormattingExtensions.cs
          git commit -m "Regenerate localization-aware typed parsers"
          git push origin HEAD:feature/structural-localization-consistency
