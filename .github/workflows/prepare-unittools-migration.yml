name: Prepare complete UnitTools rename PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Create isolated migration branch
        run: git switch -c migration/unittools-full-source-rename
      - name: Rewrite tracked code, project names, generated source, and docs
        run: python scripts/migrate_to_unittools.py
      - name: Refresh public API compatibility baseline
        run: dotnet run --project tools/UnitTools.ApiCompat/UnitTools.ApiCompat.csproj --configuration Release -- --write
      - name: Check generated source consistency
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_additional_families.py --check
          python scripts/generate_aliases.py --check
          python scripts/generate_localization.py --check
          python scripts/generate_quantity_api.py --check
          python scripts/generate_legacy_named_quantities.py --check
          python scripts/generate_length_quantity.py --check
          python scripts/verify_decimal_precision.py
      - name: Check full solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore UnitTools.sln
          dotnet build UnitTools.sln -c Release --no-restore
          dotnet test tests/UnitTools.Tests/UnitTools.Tests.csproj -c Release --no-build
          python scripts/verify_package_identity.py
          mkdir -p artifacts/packages
          dotnet pack src/UnitTools/UnitTools.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/UnitTools.SystemTextJson/UnitTools.SystemTextJson.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/UnitTools.Analyzers/UnitTools.Analyzers.csproj -c Release --no-build -o artifacts/packages
          python scripts/verify_package.py artifacts/packages
      - name: Push migration branch and open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "Migrate full UnitConverter source API to UnitTools"
          git push --set-upstream origin migration/unittools-full-source-rename
          gh pr create --base main --head migration/unittools-full-source-rename \
            --title "Complete UnitTools source, generated API, and project rename" \
            --body "Automated one-time rename. Includes regenerated public API baseline and release validation. Review breaking public API changes before merging. Does not publish NuGet packages."
