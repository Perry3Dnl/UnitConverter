name: Build, test and pack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore UnitConverter.sln
      - name: Build
        run: dotnet build UnitConverter.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/RealisticPhysics.UnitConversion.Tests/RealisticPhysics.UnitConversion.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=UnitConverter.trx" --results-directory artifacts/test-results
      - name: Pack
        run: dotnet pack src/RealisticPhysics.UnitConversion/RealisticPhysics.UnitConversion.csproj --configuration Release --no-build --output artifacts/packages
      - name: Verify package and consume it in a clean project
        run: python scripts/verify_package.py artifacts/packages
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*nupkg
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
