name: Build, test and pack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify UnitTools package identity and shared version
        run: python scripts/verify_package_identity.py
      - name: Verify generated additional families
        run: python scripts/generate_additional_families.py --check
      - name: Verify generated aliases
        run: python scripts/generate_aliases.py --check
      - name: Verify generated localization
        run: python scripts/generate_localization.py --check
      - name: Verify generated quantity API
        run: python scripts/generate_quantity_api.py --check
      - name: Verify catalog-wide legacy named quantities
        run: python scripts/generate_legacy_named_quantities.py --check
      - name: Verify generated Length quantity surface
        run: python scripts/generate_length_quantity.py --check
      - name: Verify decimal precision routes
        run: python scripts/verify_decimal_precision.py
      - name: Verify public API compatibility baseline
        shell: bash
        run: |
          set +e
          dotnet run --project tools/UnitTools.ApiCompat/UnitTools.ApiCompat.csproj --configuration Release -- --check 2>&1 | tee api-compat-check.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            {
              echo '### Public API compatibility failure'
              echo 'Full check output:'
              echo '```text'
              tail -n 100 api-compat-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Restore
        run: dotnet restore UnitTools.sln
      - name: Build
        run: dotnet build UnitTools.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/UnitTools.Tests/UnitTools.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=UnitTools.trx" --results-directory artifacts/test-results
      - name: Verify analyzer diagnostic
        shell: bash
        run: |
          mkdir -p artifacts/analyzers
          dotnet build tests/UnitTools.AnalyzerSmoke/UnitTools.AnalyzerSmoke.csproj --configuration Release 2>&1 | tee artifacts/analyzers/build.log
          test "$(grep -Eo 'Program\.cs\([0-9]+,[0-9]+\): warning UC0002' artifacts/analyzers/build.log | sort -u | wc -l)" -eq 2
      - name: Pack
        run: |
          dotnet pack src/UnitTools/UnitTools.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/UnitTools.SystemTextJson/UnitTools.SystemTextJson.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/UnitTools.Analyzers/UnitTools.Analyzers.csproj --configuration Release --no-build --output artifacts/packages
      - name: Verify package and consume it in a clean project
        run: python scripts/verify_package.py artifacts/packages
      - name: Publish NativeAOT smoke consumer
        run: dotnet publish samples/UnitTools.NativeAotSmoke/UnitTools.NativeAotSmoke.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/nativeaot
      - name: Run NativeAOT smoke consumer
        run: ./artifacts/nativeaot/UnitTools.NativeAotSmoke
      - name: Publish JSON NativeAOT smoke consumer
        run: dotnet publish samples/UnitTools.JsonNativeAotSmoke/UnitTools.JsonNativeAotSmoke.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/json-nativeaot
      - name: Run JSON NativeAOT smoke consumer
        run: ./artifacts/json-nativeaot/UnitTools.JsonNativeAotSmoke
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*nupkg
          if-no-files-found: error
      - name: Upload API compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-compat-diagnostics
          path: |
            api-compat-check.log
            artifacts/api-compat/public-api-current.txt
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore