name: Generate public API baseline

on:
  push:
    branches:
      - quality/release-hardening-pass
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quality/release-hardening-pass
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Generate public API baseline
        run: python scripts/generate_public_api.py
      - name: Generate localization coverage
        run: python scripts/check_localization_coverage.py
      - name: Commit generated release baselines
        shell: bash
        run: |
          if git diff --quiet -- docs/api/PublicApi.txt docs/LocalizationCoverage.md; then
            echo "Generated release baselines are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/PublicApi.txt docs/LocalizationCoverage.md
          git commit -m "Generate release hardening baselines"
          git push origin HEAD:quality/release-hardening-pass
