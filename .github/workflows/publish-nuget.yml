name: NuGet Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Check version and tagged release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import xml.etree.ElementTree as E; print(E.parse("Directory.Build.props").findtext(".//Version"))')"
          echo "Release version: $VERSION"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            test "${{ github.ref_name }}" = "v$VERSION"
            git fetch origin main --quiet
            test "${{ github.sha }}" = "$(git rev-parse origin/main)"
          fi
      - name: Verify generated sources
        run: |
          python scripts/generate_additional_families.py --check
          python scripts/generate_aliases.py --check
          python scripts/generate_localization.py --check
          python scripts/generate_quantity_api.py --check
          python scripts/generate_legacy_named_quantities.py --check
          python scripts/generate_length_quantity.py --check
          python scripts/verify_decimal_precision.py
      - name: Restore
        run: |
          dotnet restore UnitConverter.sln
          dotnet restore tools/UnitConverter.ApiCompat/UnitConverter.ApiCompat.csproj
      - name: Verify public API compatibility baseline
        run: dotnet run --project tools/UnitConverter.ApiCompat/UnitConverter.ApiCompat.csproj --configuration Release --no-restore -- --check
      - name: Build
        run: dotnet build UnitConverter.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/UnitConverter.Tests/UnitConverter.Tests.csproj --configuration Release --no-build
      - name: Verify analyzer diagnostic
        shell: bash
        run: |
          mkdir -p artifacts/analyzers
          dotnet build tests/UnitConverter.AnalyzerSmoke/UnitConverter.AnalyzerSmoke.csproj --configuration Release 2>&1 | tee artifacts/analyzers/build.log
          test "$(grep -Eo 'Program\.cs\([0-9]+,[0-9]+\): warning UC0002' artifacts/analyzers/build.log | sort -u | wc -l)" -eq 2
      - name: Publish NativeAOT smoke consumer
        run: dotnet publish samples/UnitConverter.NativeAotSmoke/UnitConverter.NativeAotSmoke.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/nativeaot
      - name: Run NativeAOT smoke consumer
        run: ./artifacts/nativeaot/UnitConverter.NativeAotSmoke
      - name: Publish JSON NativeAOT smoke consumer
        run: dotnet publish samples/UnitConverter.JsonNativeAotSmoke/UnitConverter.JsonNativeAotSmoke.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/json-nativeaot
      - name: Run JSON NativeAOT smoke consumer
        run: ./artifacts/json-nativeaot/UnitConverter.JsonNativeAotSmoke
      - name: Pack release packages
        run: |
          mkdir -p artifacts/packages
          dotnet pack src/UnitConverter/UnitConverter.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/UnitConverter.SystemTextJson/UnitConverter.SystemTextJson.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/UnitConverter.Analyzers/UnitConverter.Analyzers.csproj --configuration Release --no-build --output artifacts/packages
      - name: Verify packages and clean consumer matrix
        run: python scripts/verify_package.py artifacts/packages
      - name: Upload verified packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-release-candidate
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 7

  dispatch-tagged-release:
    name: Create version tag and start release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Tag release commit and dispatch workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import xml.etree.ElementTree as E; print(E.parse("Directory.Build.props").findtext(".//Version"))')"
          TAG="v$VERSION"
          if OLD="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            test "$OLD" = "$GITHUB_SHA" || { echo "::error::Existing tag points at another commit"; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-nuget.yml/dispatches" -f ref="$TAG"

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nuget-release-candidate
          path: artifacts/packages
      - name: Verify NuGet username secret
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          test -n "$NUGET_USER" || { echo "::error::Configure GitHub secret NUGET_USER"; exit 1; }
      - name: NuGet login with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=()
          symbols=()
          for package in artifacts/packages/*.nupkg; do
            if [[ "$package" == *.snupkg ]]; then
              symbols+=("$package")
            else
              packages+=("$package")
            fi
          done

          if [ "${#packages[@]}" -ne 3 ]; then
            echo "Expected exactly 3 release packages, found ${#packages[@]}."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --no-symbols
          done

          for symbol in "${symbols[@]}"; do
            dotnet nuget push "$symbol" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
 
          done
      - name: Generate SHA256 hashes
        shell: bash
        run: |
          cd artifacts/packages
          sha256sum *.nupkg *.snupkg > SHA256SUMS.txt
      - name: Create GitHub release with NuGet artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "UnitConverter $TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/packages/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
